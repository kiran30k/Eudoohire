# Production profile (activate with --spring.profiles.active=prod)
# All sensitive credentials MUST be set as Railway environment variables.
# No hardcoded secrets in this file.

# --- MongoDB Atlas ---
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:euodoo_hire}
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.transaction.enabled=false

# --- Cloudinary ---
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
# Startup fails fast if Cloudinary is not fully configured
app.storage.require-cloudinary=true
app.storage.dir=${APP_STORAGE_DIR:${user.home}/.euodoo-hire/uploads}
app.storage.signing-secret=${APP_STORAGE_SIGNING_SECRET:}

# --- CORS: set CORS_ALLOWED_ORIGINS in Railway to your Vercel frontend URL ---
# Example: https://eudoohire.vercel.app,https://www.yourdomain.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://eudoohire.vercel.app}

# --- Session cookie (HTTPS cross-origin: Vercel frontend → Railway backend) ---
# SameSite=None + Secure=true required for cross-origin session cookies
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none

# --- Health check ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

logging.level.com.euodoo=INFO
logging.level.org.springframework.security=INFO
server.error.include-stacktrace=never
server.error.include-message=on_param
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.port=${PORT:8080}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.check-template-location=false

# --- Subscriptions ---
app.subscription.recruiter-duration-days=${RECRUITER_SUBSCRIPTION_DAYS:30}
app.subscription.candidate-duration-days=${CANDIDATE_SUBSCRIPTION_DAYS:30}

# --- Razorpay (set RAZORPAY_KEY_ID and RAZORPAY_KEY_SECRET in Railway) ---
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.api.key=${RAZORPAY_KEY_ID}
razorpay.api.secret=${RAZORPAY_KEY_SECRET}

